<script>
  (function initSplash() {
    const btn = document.getElementById('btnGetStarted');
    const langBtn = document.getElementById('langSwitch');

    if (btn) {
      btn.addEventListener('click', () => {
        btn.classList.add('opacity-90', 'scale-[0.98]');
        const prevContent = btn.innerHTML;
        btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-xl">sync</span><span>Starting... / शुरू हो रहा है...</span>`;
        setTimeout(() => {
          btn.innerHTML = prevContent;
          btn.classList.remove('opacity-90', 'scale-[0.98]');
        }, 1000);
      });
    }

    if (langBtn) {
      let isHindi = false;
      langBtn.addEventListener('click', () => {
        isHindi = !isHindi;
        langBtn.classList.add('scale-95');
        setTimeout(() => langBtn.classList.remove('scale-95'), 150);
      });
    }
  })();
